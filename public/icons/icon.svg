<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0a192f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#060a12" stop-opacity="1"/>
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#060a12"/>
  <circle cx="256" cy="256" r="230" fill="url(#spaceGlow)"/>

  <!-- Orbital Trackers -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="12 10"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#00e5ff" stroke-width="6" stroke-opacity="0.85" filter="url(#neonGlow)"/>
  <path d="M 390 190 A 165 165 0 0 1 421 256" fill="none" stroke="#ff0055" stroke-width="8" stroke-linecap="round"/>

  <!-- Cardinal Radar Ticks -->
  <line x1="256" y1="75" x2="256" y2="105" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="407" x2="256" y2="437" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="75" y1="256" x2="105" y2="256" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>
  <line x1="407" y1="256" x2="437" y2="256" stroke="#00e5ff" stroke-width="5" stroke-linecap="round"/>

  <!-- Central Shield / Hexagon -->
  <polygon points="256,156 342,206 342,306 256,356 170,306 170,206" fill="#0b172a" stroke="#00e5ff" stroke-width="4" filter="url(#neonGlow)"/>

  <!-- Medical Vital ECG Pulse -->
  <polyline points="180,256 210,256 225,236 240,280 256,186 272,310 285,256 332,256" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Vital Pulse Indicator Peak Dot -->
  <circle cx="256" cy="186" r="8" fill="#00e5ff" filter="url(#neonGlow)"/>

  <!-- Orbiting Satellite -->
  <circle cx="395" cy="165" r="9" fill="#ffd700" filter="url(#neonGlow)"/>
</svg>
